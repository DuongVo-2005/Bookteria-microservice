server:
  port: 8888

app:
  api-prefix: /api/v1

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@redisRateLimiter}"
                key-resolver: "#{@ipKeyResolver}"
          routes:
            - id: identity-service
              uri: http://localhost:8080
              predicates:
                - Path=${app.api-prefix}/identity/**
              filters:
                - StripPrefix=2
            - id: profile-service
              uri: http://localhost:8081
              predicates:
                - Path=${app.api-prefix}/profile/users/**
              filters:
                - StripPrefix=2
            - id: notification-service
              uri: http://localhost:8082
              predicates:
                - Path=${app.api-prefix}/notification/**
              filters:
                - StripPrefix=2
            - id: post-service
              uri: http://localhost:8083
              predicates:
                - Path=${app.api-prefix}/post/**
              filters:
                - StripPrefix=2
            - id: file-service
              uri: http://localhost:8084
              predicates:
                - Path=${app.api-prefix}/file/**
              filters:
                - StripPrefix=2
            - id: chat-service
              uri: http://localhost:8085
              predicates:
                - Path=${app.api-prefix}/chat/**
              filters:
                - StripPrefix=2
            - id: book-service
              uri: http://localhost:8087
              predicates:
                - Path=${app.api-prefix}/book/**
              filters:
                - StripPrefix=2
            - id: search-service
              uri: http://localhost:8086
              predicates:
                - Path=${app.api-prefix}/search/**
              filters:
                - StripPrefix=2
            - id: friend-service
              uri: http://localhost:8088
              predicates:
                - Path=${app.api-prefix}/friend/**
              filters:
                - StripPrefix=2
            - id: group-service
              uri: http://localhost:8089
              predicates:
                - Path=${app.api-prefix}/group/**
              filters:
                - StripPrefix=2
            - id: reading-service
              uri: http://localhost:8090
              predicates:
                - Path=${app.api-prefix}/reading/**
              filters:
                - StripPrefix=2
            - id: report-service
              uri: http://localhost:8091
              predicates:
                - Path=${app.api-prefix}/report/**
              filters:
                - StripPrefix=2
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info
