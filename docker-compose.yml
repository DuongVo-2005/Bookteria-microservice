services:
  mongodb:
   image: mongo:8
   container_name: bookteria-mongodb
   restart: unless-stopped
   environment:
     MONGO_INITDB_ROOT_USERNAME: root
     MONGO_INITDB_ROOT_PASSWORD: 123456
   ports:
     - "27017:27017"
   volumes:
      - mongo_data:/data/db
  mysql:
    image: mysql:8.0
    container_name: bookteria-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: bookteria_identity
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  neo4j:
    image: neo4j:5
    container_name: bookteria-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/12345678
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  kafka:
   image: apache/kafka:4.3.1
   container_name: kafka
   ports:
     - "9092:9092"
     - "29092:29092"
   environment:
     KAFKA_NODE_ID: 1
     KAFKA_PROCESS_ROLES: broker,controller

     KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
     KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092

     KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
     KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
     KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
     KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
     KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

     KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.5
    container_name: bookteria-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  redis:
    image: redis:7-alpine
    container_name: bookteria-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Distributed tracing — nhận trace qua OTLP HTTP (port 4318) từ cả 11 service,
  # xem tại UI http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: bookteria-jaeger
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # Gom log tập trung — mỗi service push log trực tiếp qua HTTP (loki-logback-appender),
  # không cần Promtail scrape file vì service chạy trực tiếp (IntelliJ/mvn), không phải container.
  loki:
    image: grafana/loki:3.2.0
    container_name: bookteria-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  # Dashboard chung xem cả trace (Jaeger) lẫn log (Loki) — http://localhost:3001, đăng nhập ẩn danh
  # sẵn quyền Admin cho dev, KHÔNG dùng cấu hình này nếu triển khai thật.
  grafana:
    image: grafana/grafana:11.2.0
    container_name: bookteria-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - jaeger
      - loki

volumes:
  redis_data:
  es_data:
  grafana_data:
  mongo_data:
   name: bookteria-microservice_mongo_data
  mysql_data:
    name: bookteria-microservice_mysql_data
  neo4j_data:
    name: bookteria-microservice_neo4j_data
  neo4j_logs:
    name: bookteria-microservice_neo4j_logs
