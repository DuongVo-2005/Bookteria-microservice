server:
  port: 8084
  servlet:
    context-path: /file
spring:
  application:
    name: file-service
  mongodb.uri: mongodb://root:123456@localhost:27017/file-service?authSource=admin
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  file:
    storage-dir: C:/upload
    download-prefix: http://localhost:8084/file/media/download/
jwt:
  signerKey: "1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij"

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info
