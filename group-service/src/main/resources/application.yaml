server:
  port: 8089
  servlet:
    context-path: /group

spring:
  application:
    name: group-service

  mongodb:
    uri: ${MONGODB_URI:mongodb://root:123456@localhost:27017/group-service?authSource=admin}

  data:
    mongodb:
      auto-index-creation: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: group-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.devteria.group.dto.KafkaBookEvent

app:
  services:
    profile:
      url: ${PROFILE_SERVICE_URL:http://localhost:8081/profile}
    book:
      url: ${BOOK_SERVICE_URL:http://localhost:8087/book}

jwt:
  signerKey: "${JWT_SIGNER_KEY}"

management:
  endpoint:
    health:
      show-details: always

  endpoints:
    web:
      exposure:
        include: health,info
