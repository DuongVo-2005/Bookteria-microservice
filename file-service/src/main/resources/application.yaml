server:
  port: 8084
  servlet:
    context-path: /file

spring:
  application:
    name: file-service

  mongodb.uri: ${MONGODB_URI:mongodb://root:123456@localhost:27017/file-service?authSource=admin}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  file:
    storage-dir: ${FILE_STORAGE_DIR:/app/uploads}
    download-prefix: ${FILE_DOWNLOAD_PREFIX:http://localhost:8084/file/media/download/}

jwt:
  signerKey: "${JWT_SIGNER_KEY}"

management:
  endpoint:
    health:
      show-details: always

  endpoints:
    web:
      exposure:
        include: health,info
