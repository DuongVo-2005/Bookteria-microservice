server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # file-service accepts up to 10MB (spring.servlet.multipart)
    client_max_body_size 10m;

    # Resolve container names at request time so nginx does not crash at start
    # (or keep a stale IP) when the gateway/chat container is (re)created later.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/v1/ {
        set $gateway http://bookteria-api-gateway:8888;
        proxy_pass $gateway;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /socket.io/ {
        set $chat_socket http://bookteria-chat-service:8099;
        proxy_pass $chat_socket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
