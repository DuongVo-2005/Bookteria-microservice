server:
  port: 8080
  servlet:
    context-path: /identity
    session:
      cookie:
        path: /

spring:
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/bookteria_identity}"
    driverClassName: "com.mysql.cj.jdbc.Driver"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:123456}"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "1"
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: identity-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.devteria.identity.dto.KafkaAdminCommandEvent

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "${GOOGLE_REDIRECT_URI:http://localhost:8888/api/v1/identity/login/oauth2/code/google}"

jwt:
  signerKey: "${JWT_SIGNER_KEY}"

app:
  services:
    profile: "${PROFILE_SERVICE_URL:http://localhost:8081/profile}"
  oauth2:
    redirect-uri: "${OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:3000/oauth2/redirect}"

logging:
  level:
    org.springframework.security: TRACE

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info
