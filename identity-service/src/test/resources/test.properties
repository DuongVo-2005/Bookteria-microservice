spring.profiles.active = test
spring.datasource.url = jdbc:h2:mem:testdb;MODE=MYSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username = sa
spring.datasource.password = sa
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto = create-drop
# idea-spec Phase 7 - "26.1 Database Migration Scripts": Flyway dùng cho production (MySQL thật,
# ddl-auto=validate) nhưng V1__baseline.sql dump từ mysqldump có cú pháp thuần MySQL (backtick +
# CHARACTER SET/COLLATE inline + ENGINE=InnoDB...) mà H2's MODE=MYSQL không parse được đầy đủ -
# toàn bộ @SpringBootTest từ khi thêm Flyway (2026-09-17) đã fail ngầm vì test.properties trước đó
# dựa hoàn toàn vào Flyway để tạo schema (ddl-auto=none). Tách riêng: test dùng Hibernate auto-DDL
# từ JPA entity (không liên quan gì Flyway script), production vẫn validate qua Flyway như cũ.
spring.flyway.enabled = false
