server:
  port: 8091
  servlet:
    context-path: /report
spring:
  application:
    name: report-service
  mongodb:
    uri: mongodb://root:123456@localhost:27017/report-service?authSource=admin
  data:
    mongodb:
      auto-index-creation: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

# idea-spec BA GAP-03: "validate nhẹ" targetId qua Feign trước khi lưu Report PENDING.
app:
  services:
    profile:
      url: http://localhost:8081/profile
    post:
      url: http://localhost:8083/post
    group:
      url: http://localhost:8089/group
    book:
      url: http://localhost:8087/book

jwt:
  signerKey: "1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij"

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info
