server:
  port: 8083
  servlet:
    context-path: /post

spring:
  application:
    name: post-service

  mongodb.uri: ${MONGODB_URI:mongodb://root:123456@localhost:27017/post-service?authSource=admin}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: post-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.devteria.post.dto.KafkaAdminCommandEvent

app:
  service:
    profile:
      url: ${PROFILE_SERVICE_URL:http://localhost:8081/profile}
    friend:
      url: ${FRIEND_SERVICE_URL:http://localhost:8088/friend}
    book:
      url: ${BOOK_SERVICE_URL:http://localhost:8087/book}

jwt:
  signerKey: "${JWT_SIGNER_KEY}"

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info
